<head>

<title>The geoLAB at work</title>

<script>document.documentElement.setAttribute('data-tema','hud')</script>

<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --s1: #2a78d6; --run: #86b6ef; --ok: #0ca30c; --warn: #b67a00; --warn-bg: rgba(250,178,25,.16); --bad: #d03b3b;
  --m1: #2a78d6; --m2: #eb6834; --m3: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --s1: #3987e5; --run: #184f95; --ok: #0ca30c; --warn: #fab219; --warn-bg: rgba(250,178,25,.14); --bad: #e66767;
    --m1: #3987e5; --m2: #d95926; --m3: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --s1: #3987e5; --run: #184f95; --ok: #0ca30c; --warn: #fab219; --warn-bg: rgba(250,178,25,.14); --bad: #e66767;
  --m1: #3987e5; --m2: #d95926; --m3: #199e70;
}
* { box-sizing: border-box; }
html { background: var(--page); scroll-behavior: smooth; scroll-padding-top: 56px; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2.sec { font-size: 17px; margin: 22px 0 10px; font-weight: 650; }
.sub { color: var(--ink2); font-size: 13px; }
.note { color: var(--ink2); font-size: 12.5px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 12px; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
.pill.ok .ic, .pill.done .ic { color: var(--ok); } .pill.warn .ic { color: var(--warn); } .pill.bad .ic { color: var(--bad); }
.pill.run .ic { color: var(--s1); } .pill.idle .ic { color: var(--muted); }
.pill.run .ic, .livedot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.top .pill { font-size: 13px; padding: 3px 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.tile .v { font-size: 24px; font-weight: 650; line-height: 1.15; }
.tile .v small { font-size: 12px; font-weight: 400; color: var(--ink2); margin-left: 4px; }
.tile .l { color: var(--ink2); font-size: 12px; margin-top: 2px; }
.tile.warn .v { color: var(--warn); }
.alert { border: 1px solid var(--border); border-left: 4px solid var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.alert b { display: block; margin-bottom: 2px; }
.alert .ic { color: var(--warn); margin-right: 4px; }
.alert a { color: inherit; text-decoration: none; } .alert a:hover { text-decoration: underline; }
.alert .meta { color: var(--ink2); font-size: 12px; margin-top: 4px; display: flex; gap: 6px; align-items: center; }
.stale { display: none; border: 1px solid var(--bad); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; color: var(--bad); font-weight: 600; }
.nav { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 0; margin: 0 0 12px; background: var(--page); border-bottom: 1px solid var(--grid); }
.nav a, .nav button, .btn { color: var(--ink); text-decoration: none; font: inherit; font-size: 13px; padding: 4px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); cursor: pointer; }
.nav a:hover, .nav button:hover, .btn:hover { border-color: var(--s1); }
.nav a.ext { border-color: var(--s1); }
.nav .sp { flex: 1; }
.grp { margin: 14px 0 6px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink2); font-weight: 650; }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.pc { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: block; color: inherit; text-decoration: none; }
a.pc:hover { border-color: var(--s1); }
.pc .h { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.pc .t { font-weight: 650; line-height: 1.25; }
.pc .pct { font-size: 22px; font-weight: 650; line-height: 1.1; margin: 8px 0 4px; display: flex; align-items: baseline; gap: 8px; }
.pc .pct small { font-size: 12px; font-weight: 400; color: var(--ink2); }
.pc .m { color: var(--ink2); font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; }
.pc .m.warn { color: var(--warn); font-weight: 600; } .pc .m.bad { color: var(--bad); font-weight: 600; }
.pc .tec { margin-top: 8px; font-size: 12.5px; color: var(--ink); overflow-wrap: anywhere; }
.pc ul.mk { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; color: var(--ink2); }
.pc ul.mk li { padding: 1px 0 1px 14px; position: relative; overflow-wrap: anywhere; }
.pc ul.mk li::before { content: "\2610"; position: absolute; left: 0; color: var(--muted); }
.pc ul.mk li.warn { color: var(--warn); font-weight: 600; } .pc ul.mk li.bad { color: var(--bad); font-weight: 600; } .pc ul.mk li.more { color: var(--muted); }
.pc ul.mk li.more::before { content: ""; }
.pc .go { margin-top: 8px; font-size: 12.5px; color: var(--s1); font-weight: 600; }
.pc svg.sp { display: block; margin-top: 6px; }
.track { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
.track.s { height: 6px; border-radius: 3px; margin-top: 3px; }
.fill { height: 100%; background: var(--s1); border-radius: 0 5px 5px 0; }
.track.live .fill { background-image: repeating-linear-gradient(110deg, rgba(255,255,255,.28) 0 8px, rgba(255,255,255,0) 8px 16px); background-size: 32px 100%; animation: slide 1.1s linear infinite; }
@keyframes slide { to { background-position: 32px 0; } }
.steps { display: flex; gap: 2px; margin-top: 6px; }
.steps i { flex: 1; height: 6px; border-radius: 2px; background: var(--grid); position: relative; overflow: hidden; }
.steps i b { position: absolute; inset: 0 auto 0 0; background: var(--s1); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip { display: inline-flex; gap: 5px; align-items: baseline; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; }
.chip.warn { color: var(--warn); border-color: var(--warn); font-weight: 600; } .chip.bad { color: var(--bad); border-color: var(--bad); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; background: var(--muted); }
.mc0 { --c: var(--m1); } .mc1 { --c: var(--m2); } .mc2 { --c: var(--m3); } .mc3 { --c: var(--muted); }
.dot[class*=mc] { background: var(--c); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink2); font-weight: 600; }
td a { color: inherit; text-decoration: none; font-weight: 600; } td a:hover { text-decoration: underline; }
td .d { color: var(--ink2); font-size: 12px; margin-top: 1px; }
td.nw, th.nw { white-space: nowrap; }
.tl { overflow-x: auto; }
.tl svg { display: block; min-width: 720px; width: 100%; height: auto; }
.tl text { fill: var(--muted); font-size: 10.5px; font-family: inherit; }
.tl .lbl { fill: var(--ink); font-size: 12px; }
.tl .hoggi { fill: var(--ink); font-weight: 700; } .tl .hwe { opacity: .6; } .tl .hmese { font-weight: 650; fill: var(--ink2); }
.tl .sep { stroke: var(--grid); }
.tl .cell { fill: var(--c); } .tl .cell0 { fill: var(--grid); opacity: .7; }
.tl .gl { font-size: 13px; font-weight: 700; }
.tl .e-run { fill: var(--s1); } .tl .e-wait { fill: var(--warn); } .tl .e-ok { fill: var(--ok); } .tl .e-idle { fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink2); font-size: 12px; margin-top: 10px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--axis); }
.scala { display: inline-flex; gap: 2px; vertical-align: middle; } .scala i { width: 14px; height: 12px; border-radius: 3px; background: var(--m1); }
.empty { color: var(--ink2); border: 1px dashed var(--axis); border-radius: 8px; padding: 12px 14px; }
details summary { cursor: pointer; color: var(--ink2); font-size: 13px; margin-top: 8px; }
details ul { list-style: none; padding: 0; margin: 6px 0 0; font-size: 12.5px; color: var(--ink2); }
details li { display: flex; gap: 8px; padding: 1px 0; } details li.f { color: var(--ink); }
code { background: var(--grid); border-radius: 4px; padding: 0 5px; font-size: 12px; }
.noanim *, .noanim *::before, .noanim *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }
@media (max-width: 520px) { main { padding: 12px; } .tile .v { font-size: 20px; } .pcards { grid-template-columns: 1fr; } .hide-s { display: none; } }
.hud-only { display: none; }
:root[data-tema="hud"] {
  color-scheme: dark;
  --page: #0a0814; --surface: #110e20; --ink: #ece9fb; --ink2: #b6b0d8; --muted: #7f79a8;
  --grid: #251f40; --axis: #3b3463; --border: rgba(167,139,250,.30);
  --s1: #a78bfa; --run: #4c3f8f; --run-ink: #ece9fb; --done-ink: #0a0814; --shade: rgba(167,139,250,.16);
  --ok: #4ade80; --warn: #fbbf24; --warn-bg: rgba(251,191,36,.10); --bad: #f87171;
  --seq0: #2a2350; --seq1: #d4c8ff; --s2: #ff9158;
  --m1: #6aa8ff; --m2: #ff9158; --m3: #2dd4bf; --m1-ink: #0a0814; --m2-ink: #0a0814; --m3-ink: #0a0814;
  --mono: "JetBrains Mono", "Cascadia Mono", "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --glow: 0 0 14px rgba(167,139,250,.35);
}
html[data-tema="hud"] { background: var(--page); }
:root[data-tema="hud"] body {
  font-family: var(--mono); font-size: 13px; letter-spacing: .01em;
  background:
    radial-gradient(900px 480px at 78% -8%, rgba(124,92,230,.20), transparent 62%),
    radial-gradient(700px 420px at 8% 30%, rgba(80,60,170,.12), transparent 60%),
    linear-gradient(rgba(167,139,250,.035) 1px, transparent 1px) 0 0 / 100% 36px,
    linear-gradient(90deg, rgba(167,139,250,.035) 1px, transparent 1px) 0 0 / 36px 100%,
    var(--page);
  background-attachment: fixed;
}
:root[data-tema="hud"] main { counter-reset: sec; }

:root[data-tema="hud"] h1 { font-size: clamp(17px, 4.6vw, 34px); letter-spacing: .2em; text-transform: uppercase; font-weight: 600; text-shadow: 0 0 18px rgba(167,139,250,.45); }
:root[data-tema="hud"] .sub, :root[data-tema="hud"] .note { font-size: 11.5px; }
:root[data-tema="hud"] h2, :root[data-tema="hud"] h2.sec { font-size: 12.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
:root[data-tema="hud"] h2.sec { margin: 26px 0 12px; padding-bottom: 7px; border-bottom: 1px dashed var(--axis); }
:root[data-tema="hud"] h2.sec::before { counter-increment: sec; content: "\25CF  " counter(sec, decimal-leading-zero) " / "; color: var(--s1); }
:root[data-tema="hud"] section.card > h2::before { content: "\25CF  "; color: var(--s1); }
:root[data-tema="hud"] .grp { letter-spacing: .16em; color: var(--s1); font-size: 11px; }
:root[data-tema="hud"] .grp::before { content: "\2500\2500 "; color: var(--axis); }

:root[data-tema="hud"] .hudbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; justify-content: space-between; margin: 0 0 14px; padding-bottom: 7px; border-bottom: 1px dashed var(--axis); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hudbar .live { display: inline-flex; align-items: center; gap: 6px; background: var(--s1); color: #0a0814; font-weight: 700; padding: 1px 9px; border-radius: 2px; letter-spacing: .18em; }
.hudbar .live i { width: 6px; height: 6px; border-radius: 50%; background: #0a0814; animation: pulse 1.6s ease-in-out infinite; }
.hudbar .kv { display: inline-flex; gap: 14px; flex-wrap: wrap; }
.hudbar .kv b { color: var(--ink); font-weight: 600; margin-left: 5px; letter-spacing: .06em; }
.hudbar .kv b.w { color: var(--warn); }

:root[data-tema="hud"] :is(.card, .tile, .pc, .mat, figure, .mini, .panel) {
  border-radius: 3px; border: 1px solid var(--border);
  background:
    linear-gradient(var(--s1), var(--s1)) top left / 11px 1px no-repeat,
    linear-gradient(var(--s1), var(--s1)) top left / 1px 11px no-repeat,
    linear-gradient(var(--s1), var(--s1)) bottom right / 11px 1px no-repeat,
    linear-gradient(var(--s1), var(--s1)) bottom right / 1px 11px no-repeat,
    linear-gradient(180deg, rgba(167,139,250,.07), rgba(167,139,250,0) 55%),
    var(--surface);
}
:root[data-tema="hud"] a.pc:hover, :root[data-tema="hud"] .nav a:hover, :root[data-tema="hud"] .nav button:hover, :root[data-tema="hud"] .btn:hover { border-color: var(--s1); box-shadow: var(--glow); }
:root[data-tema="hud"] .tile .v { font-size: 25px; font-weight: 500; letter-spacing: .02em; text-shadow: 0 0 14px rgba(167,139,250,.35); }
:root[data-tema="hud"] .tile .l, :root[data-tema="hud"] .stat .l { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
:root[data-tema="hud"] .tile.warn .v { text-shadow: 0 0 14px rgba(251,191,36,.45); }
:root[data-tema="hud"] .pc .t { letter-spacing: .02em; }
:root[data-tema="hud"] .pc .pct { font-weight: 500; text-shadow: 0 0 12px rgba(167,139,250,.35); }
:root[data-tema="hud"] .pc .go { letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
:root[data-tema="hud"] .alert { border-radius: 3px; border-left-width: 3px; }

:root[data-tema="hud"] .track { border-radius: 0; height: 8px; background: var(--grid); }
:root[data-tema="hud"] .track.s { height: 5px; }
:root[data-tema="hud"] .fill { border-radius: 0; background-color: var(--s1); background-image: linear-gradient(90deg, #6d4fe0, var(--s1)); box-shadow: 0 0 10px rgba(167,139,250,.6); }
:root[data-tema="hud"] .track.live .fill { background-image: repeating-linear-gradient(110deg, rgba(255,255,255,.30) 0 8px, rgba(255,255,255,0) 8px 16px), linear-gradient(90deg, #6d4fe0, var(--s1)); background-size: 32px 100%, 100% 100%; }
:root[data-tema="hud"] .steps i { border-radius: 0; }
:root[data-tema="hud"] .steps i b { background: var(--s1); box-shadow: 0 0 6px rgba(167,139,250,.6); }

:root[data-tema="hud"] .nav { background: rgba(10,8,20,.88); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
:root[data-tema="hud"] .nav a, :root[data-tema="hud"] .nav button, :root[data-tema="hud"] .btn { border-radius: 2px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; font-family: var(--mono); background: var(--surface); }
:root[data-tema="hud"] .nav a.ext { background: var(--s1); color: #0a0814; border-color: var(--s1); font-weight: 700; }
:root[data-tema="hud"] .pill { border-radius: 2px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; }
:root[data-tema="hud"] .top .pill { font-size: 11px; padding: 3px 10px; }
:root[data-tema="hud"] .pill.run .ic { color: var(--s1); }
:root[data-tema="hud"] .chip { border-radius: 2px; }
:root[data-tema="hud"] .chip.warn { color: var(--warn); }
:root[data-tema="hud"] code, :root[data-tema="hud"] pre { border-radius: 2px; }
:root[data-tema="hud"] th { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
:root[data-tema="hud"] td, :root[data-tema="hud"] th { border-bottom-style: dashed; }
:root[data-tema="hud"] .cell { border-radius: 1px; }
:root[data-tema="hud"] #tip { border-radius: 2px; border-color: var(--s1); box-shadow: 0 0 18px rgba(167,139,250,.35); }
:root[data-tema="hud"] .stale { border-radius: 3px; }
:root[data-tema="hud"] details summary { letter-spacing: .06em; }
:root[data-tema="hud"] .tl .cell0 { opacity: .5; }

:root[data-tema="hud"] .hero.hud-only { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 0 0 14px; }
.hero .panel { padding: 0; margin: 0; overflow: hidden; min-width: 0; }
.panel .ph { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--grid); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.panel .ph b { color: var(--ink); font-weight: 600; letter-spacing: .16em; }
.panel .ph b::before { content: "\25CF  "; color: var(--s1); }
.hero canvas { display: block; width: 100%; height: 400px; touch-action: pan-y; }
.term { padding: 8px 12px 12px; font-size: 12px; line-height: 1.7;  }
.term .ln { display: grid; grid-template-columns: 3.6em minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; border-bottom: 1px dashed rgba(167,139,250,.12); }
.term .ln .v { color: var(--s1); text-transform: lowercase; }
.term .ln .v::before { content: "\203A  "; color: var(--axis); }
.term .ln .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.term .ln .s { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.term .ln .s.run { color: var(--s1); } .term .ln .s.warn { color: var(--warn); } .term .ln .s.done { color: var(--ok); } .term .ln .s.bad { color: var(--bad); }
.term .ln.run .t { text-shadow: 0 0 10px rgba(167,139,250,.5); }
.term .cur { color: var(--s1); animation: pulse 1.1s steps(2, start) infinite; }
@media (max-width: 820px) { :root[data-tema="hud"] .hero.hud-only { grid-template-columns: 1fr; } .hero canvas { height: 330px; } }
@media (max-width: 520px) { :root[data-tema="hud"] .tile .v { font-size: 20px; } .term .ln { grid-template-columns: 3em minmax(0, 1fr) auto; } }

.hero .panel { position: relative; }
.rtip { position: absolute; z-index: 6; pointer-events: none; max-width: 280px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--s1); font-size: 11px; line-height: 1.55; color: var(--ink); box-shadow: 0 0 16px rgba(167,139,250,.28); overflow-wrap: anywhere; }
.rtip b { color: var(--s1); font-weight: 600; } .rtip .rm { color: var(--muted); font-size: 10px; } .rtip .rbad { color: var(--bad); }
@media (max-width: 520px) { .term .ln { grid-template-columns: 3em minmax(0, 1fr); } .term .ln .s { grid-column: 2; white-space: normal; padding-bottom: 3px; } }

.term .s .rc { font-weight: 600; letter-spacing: .06em; margin-right: 2px; } .term .s .rc.on { color: var(--ok); } .term .s .rc.off { color: var(--bad); }

.term .ln .dt { grid-column: 2 / -1; color: var(--muted); font-size: 11px; line-height: 1.5; letter-spacing: 0; padding: 1px 0 7px; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.term .ln .dt.open { display: block; }
